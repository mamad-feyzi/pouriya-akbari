      justify-content: center;
      padding: 24px;
      background: #111;
      color: #f2f2f2;
      font-family: Tahoma, Arial, sans-serif;
    }
    .card {
      width: min(430px, 100%);
      background: #181818;
      border: 1px solid #292929;
      border-radius: 24px;
      padding: 38px 24px 28px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    .avatar {
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 35% 30%, #303030, #151515 65%);
      border: 1px solid #3a3a3a;
      font-family: Georgia, "Times New Roman", serif;
      font-size: 50px;
      font-weight: 900;
      font-style: italic;
      color: #f5f5f5;
      text-shadow: 3px 3px 0 #080808, 0 0 18px rgba(255,255,255,.12);
      box-shadow: inset 0 0 18px rgba(255,255,255,.04), 0 8px 30px rgba(0,0,0,.35);
    }
    h1 { font-size: 27px; margin-bottom: 28px; }
    .links { display: grid; gap: 13px; }
    .link {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 15px 17px;
      border-radius: 15px;
      background: #202020;
      border: 1px solid #2d2d2d;
      color: #f2f2f2;
      text-decoration: none;
      transition: .2s ease;
      text-align: right;
    }
    .link:hover {
      transform: translateY(-2px);
      background: #262626;
      border-color: #444;
    }
    .icon {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 12px;
      display: grid;
      place-items: center;
      background: #2b2b2b;
      color: #fff;
    }
    .icon svg { width: 22px; height: 22px; fill: currentColor; }
    .label { font-size: 13px; color: #9b9b9b; margin-bottom: 3px; }
    .value { font-size: 16px; direction: ltr; unicode-bidi: plaintext; }
    footer { margin-top: 24px; color: #666; font-size: 12px; }
  </style>
